version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uteclocal-gateway
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for config.json and gateway.log
      - uteclocal-data:/data
    environment:
      # Local timezone for accurate log timestamps
      - TZ=Australia/Sydney
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/config || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - uteclocal-network

networks:
  uteclocal-network:
    driver: bridge

volumes:
  # Named volume for persistent data
  uteclocal-data:
    driver: local
